<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feishu-livechat demo</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2329; --muted: #8f959e; --me: #3370ff; --me-text: #fff; --border: #dee0e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --card: #1f1f1f; --text: #e8e8e8; --muted: #8a8a8a; --me: #3370ff; --me-text: #fff; --border: #333; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px; gap: 8px; }
  header { display: flex; gap: 8px; align-items: center; }
  header input { flex: 1; min-width: 0; }
  input, textarea, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--me); color: var(--me-text); border-color: var(--me); }
  #status { color: var(--muted); font-size: 12px; min-height: 18px; }
  #list { flex: 1; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #more { align-self: center; font-size: 12px; }
  .msg { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 8px 12px; border-radius: 12px; background: var(--bg); white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--me); color: var(--me-text); }
  .bubble img { display: block; max-width: 100%; max-height: 240px; border-radius: 6px; }
  .meta { font-size: 11px; color: var(--muted); }
  .meta.failed { color: #f54a45; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; height: 64px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <input id="token" placeholder="粘贴 feishu-livechat token 生成的用户 token" autocomplete="off">
    <button id="connect">连接</button>
  </header>
  <div id="status"></div>
  <div id="list"><button id="more" hidden>加载更早的消息</button></div>
  <form id="form">
    <textarea id="text" placeholder="输入消息，Enter 发送，Shift+Enter 换行；可直接粘贴截图"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label><button type="button" id="pick">图片</button><input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
      <button class="primary">发送</button>
    </div>
  </form>
</div>
<script>
// A minimal client for the feishu-livechat HTTP API: history, sending text
// and images, and live updates over SSE (read with fetch so the token can go
// in the Authorization header). Messages are upserted by id.
const API = "/api";
const $ = (id) => document.getElementById(id);
const list = $("list"), more = $("more"), status = $("status");
const messages = new Map(); // id → view
let token = "", stream = null, oldest = "", newest = "";

function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (!res.ok && res.status !== 204) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function upsert(m) {
  messages.set(m.id, m);
  if (!oldest || m.id < oldest) oldest = m.id;
  if (!newest || m.id > newest) newest = m.id;
}

function render(stickToBottom) {
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.querySelectorAll(".msg").forEach((n) => n.remove());
  [...messages.values()].sort((a, b) => (a.id < b.id ? -1 : 1)).forEach((m) => {
    const el = document.createElement("div");
    el.className = "msg " + m.sender;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (m.recalled) {
      bubble.textContent = "消息已撤回";
    } else {
      for (const b of m.blocks) {
        if (b.type === "text") bubble.append(document.createTextNode(b.text));
        if (b.type === "image") {
          const img = document.createElement("img");
          img.src = new URL(b.url, location.origin + API + "/").href;
          if (b.width) { img.width = b.width; img.height = b.height; }
          img.style.height = "auto";
          bubble.append(img);
        }
      }
    }
    const meta = document.createElement("div");
    meta.className = "meta" + (m.status === "failed" ? " failed" : "");
    const time = new Date(m.created_at).toLocaleTimeString();
    meta.textContent = m.sender === "agent" ? (m.agent || "客服") + " · " + time : time + (m.status === "sending" ? " · 发送中" : m.status === "failed" ? " · 发送失败" : "");
    el.append(bubble, meta);
    list.append(el);
  });
  if (stickToBottom || atBottom) list.scrollTop = list.scrollHeight;
}

async function markRead() {
  if (!newest || document.hidden) return;
  try { await api("/read", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message_id: newest }) }); } catch {}
}

async function loadOlder() {
  const page = await api("/messages?limit=30" + (oldest ? "&before=" + oldest : ""));
  page.messages.forEach(upsert);
  more.hidden = !page.has_more;
  render(false);
}

async function catchUp() {
  // Fill whatever the stream missed while it was down.
  let more = true;
  while (more && newest) {
    const page = await api("/messages?limit=100&after=" + newest);
    page.messages.forEach(upsert);
    more = page.has_more && page.messages.length > 0;
  }
  render(false);
}

async function listen() {
  stream?.abort();
  const ctrl = (stream = new AbortController());
  let delay = 1000;
  while (!ctrl.signal.aborted) {
    try {
      const res = await fetch(API + "/events", { headers: { Authorization: "Bearer " + token }, signal: ctrl.signal });
      if (!res.ok) throw new Error(res.status === 401 ? "token 无效或已过期" : res.statusText);
      status.textContent = "已连接";
      delay = 1000;
      await catchUp();
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = /^event: (.*)$/m.exec(chunk)?.[1];
          const data = /^data: (.*)$/m.exec(chunk)?.[1];
          if (ev === "message" && data) { upsert(JSON.parse(data)); render(false); markRead(); }
        }
      }
    } catch (e) {
      if (ctrl.signal.aborted) return;
      status.textContent = "连接断开，重连中… " + e.message;
    }
    await new Promise((r) => setTimeout(r, delay));
    delay = Math.min(delay * 2, 30000);
  }
}

async function connect() {
  token = $("token").value.trim();
  if (!token) return;
  save("livechat-demo-token", token);
  messages.clear(); oldest = newest = "";
  try {
    await loadOlder();
    render(true);
    markRead();
    listen();
  } catch (e) { status.textContent = "连接失败：" + e.message; }
}

async function sendText() {
  const text = $("text").value.trim();
  if (!text || !token) return;
  $("text").value = "";
  try { upsert(await api("/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })); render(true); }
  catch (e) { status.textContent = "发送失败：" + e.message; $("text").value = text; }
}

async function sendImage(file) {
  if (!file || !token) return;
  try { upsert(await api("/images", { method: "POST", headers: { "Content-Type": file.type || "application/octet-stream" }, body: file })); render(true); }
  catch (e) { status.textContent = "图片发送失败：" + e.message; }
}

$("connect").onclick = connect;
more.onclick = loadOlder;
$("form").onsubmit = (e) => { e.preventDefault(); sendText(); };
$("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } };
$("text").onpaste = (e) => { const f = [...e.clipboardData.files].find((f) => f.type.startsWith("image/")); if (f) { e.preventDefault(); sendImage(f); } };
$("pick").onclick = () => $("file").click();
$("file").onchange = () => { sendImage($("file").files[0]); $("file").value = ""; };
document.addEventListener("visibilitychange", markRead);
$("token").value = load("livechat-demo-token");
if ($("token").value) connect();
</script>
</body>
</html>
